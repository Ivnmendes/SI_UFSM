<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-title">
            <h2>Formulário de Contato</h2>
        </div>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>
                <div class="campo-esquerda">
                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                        >
                    </div>
                    <div class="campo">
                        <label for="idade">Idade:</label>
                        <input
                            type="number"
                            id="idade"
                            name="idade"
                            placeholder="Idade"
                        >
                    </div>
                    <div class="campo campo-sexo">
                        <label>Sexo:</label>
                        <input
                            type="radio"
                            id="masculino"
                            name="sexo"
                            value="masculino"
                        >
                        <label class="label-sexo" for="masculino">Masculino</label>
                        <input
                            type="radio"
                            id="feminino"
                            name="sexo"
                            value="feminino"
                        >
                        <label class="label-sexo" for="feminino">Feminino</label>
                    </div>
                </div>
                <div class="campo-direita">
                    <div class="campo">
                        <label for="sobrenome">Sobrenome:</label>
                        <input
                            type="text"
                            id="sobrenome"
                            name="sobrenome"
                            placeholder="Digite seu sobrenome"
                        >
                    </div>
                    <div class="campo">
                        <label for="nascimento">Data de nascimento:</label>
                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento"
                        >
                    </div>
                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                        >
                    </div>
                    <div class="campo">
                        <label for="cor">Cor preferida:</label>
                        <input
                            type="color"
                            id="cor"
                            name="cor"
                            value="#000000"
                        >
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone:</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="Digite seu telefone"
                        >
                    </div>
                </div>
                <div class="limpar"></div>
            </fieldset>
            <fieldset>
                <legend>Endereço</legend>
                <div class="campo-endereco">
                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="Digite o CEP"
                    >
                </div>
                <div class="campo-endereco">
                    <label for="logradouro">Logradouro:</label>
                    <input
                        type="text"
                        id="logradouro"
                        name="logradouro"
                        placeholder="Digite o logradouro"
                    >
                </div>
                <div class="campo-endereco">
                    <label for="complemento">Complemento:</label>
                    <input
                        type="text"
                        id="complemento"
                        name="complemento"
                        placeholder="Digite o complemento"
                    >
                </div>
                <div class="campo-endereco">
                    <label for="numero">Número:</label>
                    <input
                        type="number"
                        id="numero"
                        name="numero"
                        placeholder="Número"
                    >
                </div>
                <div class="campo-endereco">
                    <label for="bairro">Bairro:</label>
                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Digite o bairro"
                    >
                </div>
                <div class="campo-endereco">
                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite a cidade"
                    >
                </div>
                <div class="campo-endereco">
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado">
                        <option value="">Selecione</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="PR">Paraná</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="BA">Bahia</option>
                        <option value="PE">Pernambuco</option>
                        <option value="CE">Ceará</option>
                        <option value="PA">Pará</option>
                        <option value="AM">Amazonas</option>
                        <option value="DF">Distrito Federal</option>
                    </select>
                </div>
            </fieldset>
            <fieldset>
                <legend>Observações</legend>
                <label for="mensagem">Mensagem:</label>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Digite sua mensagem"
                ></textarea>
                <label>Como você conheceu nosso contato?</label>
                <ul>
                    <li>
                        <input
                            type="checkbox"
                            id="facebook"
                            name="origem"
                            value="facebook"
                        >
                        <label for="facebook">Facebook</label>
                    </li>

                    <li>
                        <input
                            type="checkbox"
                            id="whatsapp"
                            name="origem"
                            value="whatsapp"
                        >
                        <label for="whatsapp">WhatsApp</label>
                    </li>

                    <li>
                        <input
                            type="checkbox"
                            id="internet"
                            name="origem"
                            value="internet"
                        >
                        <label for="internet">Internet</label>
                    </li>

                    <li>
                        <input
                            type="checkbox"
                            id="outros"
                            name="origem"
                            value="outros"
                        >
                        <label for="outros">Outros</label>
                    </li>
                </ul>
            </fieldset>
            <div class="botoes">
                <div class="botao">
                    <input type="submit" value="Enviar">
                </div>
                <div class="botao">
                    <input type="reset" value="Limpar">
                </div>
            </div>
        </form>
    </div>
</body>
</html>
